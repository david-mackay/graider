services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: graider
      POSTGRES_PASSWORD: graider
      POSTGRES_DB: graider
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
